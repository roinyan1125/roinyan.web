<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>記事￤ロイにゃんのブログ</title>

<link rel="icon" type="image/png" href="../gazou/roinyan.png">

<meta name="description" content="作成中のページです">

<link
    href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap"
    rel="stylesheet"
>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #ffffff;
    }

    /* =========================
       ヘッダー
    ========================= */

    header {
        background: #87cefa;
        padding: 25px 15px;
        text-align: center;
        color: #fff;
    }

    header h1 {
        margin: 0;
        font-size: 34px;
    }

    /* =========================
       ナビゲーション
    ========================= */

    .nav {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .nav a {
        text-decoration: none;
        color: #87cefa;
        background: #fff;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
    }

    .dropdown {
        position: relative;
        display: inline-block;
    }

    .dropbtn {
        border: none;
        background: #fff;
        color: #87cefa;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        font-family: "Zen Maru Gothic", sans-serif;
        cursor: pointer;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        top: 110%;
        left: 0;
        min-width: 180px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        z-index: 1000;
    }

    .dropdown-content a {
        display: block;
        padding: 10px 15px;
        color: #555;
        text-decoration: none;
        font-size: 14px;
    }

    .dropdown-content a:hover {
        background: #f5faff;
    }

    .dropdown:hover .dropdown-content {
        display: block;
    }

    /* =========================
       作成中ページ
    ========================= */

    .comingsoon {
        min-height: 520px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
    }

    .comingsoon-box {
        width: 100%;
        max-width: 650px;
        text-align: center;
        background: #fff;
        border: 3px solid #d7f2ff;
        border-radius: 30px;
        padding: 55px 30px;
        box-shadow: 0 10px 30px rgba(135, 206, 250, 0.18);
        position: relative;
        overflow: hidden;
    }

    /* 飾り */

    .comingsoon-box::before {
        content: "";
        position: absolute;
        width: 130px;
        height: 130px;
        background: #e9f8ff;
        border-radius: 50%;
        top: -60px;
        left: -50px;
    }

    .comingsoon-box::after {
        content: "";
        position: absolute;
        width: 100px;
        height: 100px;
        background: #f1fbff;
        border-radius: 50%;
        bottom: -45px;
        right: -35px;
    }

    .coming-icon {
        font-size: 70px;
        margin-bottom: 15px;
        animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-10px);
        }
    }

    .comingsoon h2 {
        margin: 0;
        color: #87cefa;
        font-size: 30px;
    }

    .comingsoon p {
        margin: 18px 0 0;
        color: #666;
        font-size: 15px;
        line-height: 1.9;
    }

    /* =========================
       ドットアニメーション
    ========================= */

    .dots {
        margin-top: 20px;
        color: #87cefa;
        font-size: 22px;
        letter-spacing: 5px;
    }

    .dots span {
        display: inline-block;
        animation: dot 1.4s infinite;
    }

    .dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes dot {
        0%,
        60%,
        100% {
            transform: translateY(0);
            opacity: 0.4;
        }

        30% {
            transform: translateY(-7px);
            opacity: 1;
        }
    }

    .back-home {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 22px;
        background: #87cefa;
        color: white;
        text-decoration: none;
        border-radius: 999px;
        font-size: 14px;
        transition: 0.2s;
    }

    .back-home:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(135, 206, 250, 0.35);
    }

    /* =========================
       フッター
    ========================= */

    footer {
        margin-top: 40px;
        background: #87cefa;
        color: white;
        padding: 25px;
        position: relative;
    }

    .footer-wrap {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        max-width: 1200px;
        margin: 0 auto;
        gap: 20px;
    }

    .footer-img {
        width: 320px;
        height: 180px;
        object-fit: cover;
        border-radius: 12px;
        border: 2px solid white;
    }

    .footer-links {
        display: flex;
        gap: 25px;
    }

    .footer-box h3 {
        margin: 0 0 10px;
        font-size: 15px;
    }

    .footer-box a {
        display: block;
        color: white;
        text-decoration: none;
        font-size: 13px;
        margin-bottom: 6px;
    }

    .footer-box a:hover {
        text-decoration: underline;
    }

    .footer-logo {
        position: absolute;
        right: -20px;
        bottom: -60px;
        width: 200px;
        height: auto;
        z-index: 10;
    }

    .copyright {
        text-align: center;
        margin-top: 15px;
        font-size: 13px;
        opacity: 0.9;
    }

    /* =========================
       コピー防止
    ========================= */

    body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    img {
        -webkit-user-drag: none;
        user-select: none;
    }

    input,
    textarea {
        user-select: text;
    }

    /* =========================
       スマホ
    ========================= */

    @media (max-width: 700px) {
        header h1 {
            font-size: 27px;
        }

        .comingsoon {
            min-height: 450px;
            padding: 40px 15px;
        }

        .comingsoon-box {
            padding: 45px 20px;
        }

        .coming-icon {
            font-size: 60px;
        }

        .comingsoon h2 {
            font-size: 25px;
        }

        .comingsoon p {
            font-size: 14px;
        }

        .footer-wrap {
            flex-direction: column;
        }

        .footer-img {
            width: 100%;
            height: auto;
        }

        .footer-links {
            flex-wrap: wrap;
        }

        .footer-logo {
            width: 140px;
            right: -5px;
            bottom: -40px;
        }
    }
</style>

</head>

<body>

<!-- =========================
     ヘッダー
========================= -->

<header>
    <h1>ロイにゃんのブログ</h1>

    <div class="nav">
        <a href="https://roinyan.com/">ホーム</a>
        <a href="../リンク集/">リンク集</a>
        <a href="../記事/">記事</a>

        </div>
</header>

<!-- =========================
     作成中ページ
========================= -->

<main class="comingsoon">
    <div class="comingsoon-box">

        <div class="coming-icon">
            🛠️
        </div>

        <h2>
            このページは作成中です！
        </h2>

        <p>
            ただいまページを作成しています。<br>
            もう少しだけお待ちください！
        </p>

        <div class="dots">
            <span>●</span>
            <span>●</span>
            <span>●</span>
        </div>

        <a href="https://roinyan.com" class="back-home">
            🏠 ホームへ戻る
        </a>

    </div>
</main>

<!-- =========================
     フッター
========================= -->

<footer>
    <div class="footer-wrap">

        <img
            src="../gazou/左下.png"
            class="footer-img"
            alt="ブログ画像"
        >

        <div class="footer-links">

            <div class="footer-box">
                <h3>ページ一覧</h3>

                <a href="https://roinyan.com/">ホーム</a>
                <a href="../リンク集/">リンク集</a>
                <a href="../作成中.html">Discord</a>
                <a href="../作成中.html">お問合せ</a>
            </div>

            <div class="footer-box">
                <h3>その他のリンク</h3>

                <a href="Discord.roinyam.com">アイスBot</a>
            </div>

        </div>

        <img
            src="../gazou/roinyanlogo.png"
            class="footer-logo"
            alt="ロゴ"
        >

    </div>

    <div class="copyright">
        © 2026 ロイにゃんのブログ
    </div>
</footer>

<!-- =========================
     コピー防止
========================= -->

<script>
    document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
    });

    ["copy", "cut", "paste"].forEach(function (event) {
        document.addEventListener(event, function (e) {
            e.preventDefault();
        });
    });

    document.addEventListener("dragstart", function (e) {
        e.preventDefault();
    });

    document.addEventListener("keydown", function (e) {
        const key = e.key.toLowerCase();

        if (e.key === "F12") {
            e.preventDefault();
            return;
        }

        if (
            e.ctrlKey &&
            ["u", "s", "c", "x", "a", "p"].includes(key)
        ) {
            e.preventDefault();
            return;
        }

        if (
            e.ctrlKey &&
            e.shiftKey &&
            ["i", "j", "c"].includes(key)
        ) {
            e.preventDefault();
        }
    });
</script>

</body>

</html>
